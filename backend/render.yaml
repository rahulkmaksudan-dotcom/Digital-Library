services:
  # Spring Boot REST API Web Service
  - type: web
    name: thakur-dps-library-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: dps-library-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: dps-library-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: dps-library-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: "https://thakur-dps-library.vercel.app,http://localhost:5173,http://localhost:3000"

databases:
  # Supabase / Render Managed PostgreSQL Database
  - name: dps-library-db
    databaseName: dps_library
    user: dps_admin
    plan: free
    region: oregon

