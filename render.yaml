# Render Blueprint for the Digital Library Management System.
# In Render: New -> Blueprint -> select this GitHub repository.
services:
  - type: web
    name: thakur-dps-library-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DATABASE_HOST
        fromDatabase:
          name: dps-library-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: dps-library-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: dps-library-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: dps-library-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: dps-library-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://thakur-dps-library-web.onrender.com

  - type: web
    name: thakur-dps-library-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://thakur-dps-library-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dps-library-db
    databaseName: dps_library
    user: dps_admin
    plan: free
    region: oregon
